# Deploys the Forge connector (supabase/functions/forge-mcp) to Supabase
# whenever its code changes on main, so "push" also updates the connector.
# Needs one repo secret: SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
name: Deploy forge-mcp
on:
  push:
    branches: [main]
    paths: ["supabase/functions/forge-mcp/**", "supabase/config.toml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy forge-mcp --project-ref rjzfyfgymkcaffazzpff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
